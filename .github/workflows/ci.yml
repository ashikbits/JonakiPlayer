name: Jonaki Player CI

on:
  push:
    branches: [ main, "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Ubuntu ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libmpv-dev \
            libmpv2 \
            ffmpeg \
            xvfb \
            python3-cairo \
            python3-pip

      - name: Verify libmpv and Gtk Environment
        run: |
          python3 -c "import ctypes.util; print('libmpv:', ctypes.util.find_library('mpv'))"
          python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; import cairo; print('Gtk & Cairo OK')"

      - name: Run Test Suite with Virtual Display (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v
